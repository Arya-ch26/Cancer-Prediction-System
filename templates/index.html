<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancer Prediction System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1> Cancer Prediction System</h1>
    <p>Enter the patient's details to predict cancer risk.</p>

    <form action="/predict" method="POST">

        <input type="number" name="Age" placeholder="Age" required>

        <select name="Gender" required>
            <option value="" selected disabled hidden>Select Gender</option>
            <option value="0">Female</option>
            <option value="1">Male</option>
        </select>

        <input type="number" step="0.1" name="BMI" placeholder="BMI" required>

        <select name="Smoking" required>
            <option value="" selected disabled hidden>Smoking</option>
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>
        
        <select name="GeneticRisk" required>
            <option value="" selected disabled hidden>Genetic Risk</option>
            <option value="0">Low</option>
            <option value="1">Medium</option>
            <option value="2">High</option>
        </select>
                
        <input
        type="number"
        step="0.01"
        name="PhysicalActivity"
        placeholder="Physical Activity (hours/week)"
        required>


        <input
        type="number"
        step="0.01"
        name="AlcoholIntake"
        placeholder="Alcohol Intake (drinks/week)"
        required>


        <select name="CancerHistory" required>
            <option value="" selected disabled hidden>Family Cancer History</option>
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <button type="submit">Predict</button>

    </form>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
